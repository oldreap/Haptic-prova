<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tick Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-height vertical wheel, one word snapped on a centre line, muted words fading away above and below */
  :root {
    --bg: #0e1013;
    --fg: #f2efe8;
    --muted: #4a4f57;
    --accent: #ffb74a;
    --line: #23272d;
    --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --item: 76px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1ec; --fg: #16181c; --muted: #b3b0a8; --accent: #c2410c; --line: #dedbd3;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f1ec; --fg: #16181c; --muted: #b3b0a8; --accent: #c2410c; --line: #dedbd3;
    color-scheme: light;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding-inline: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stage { position: relative; height: 100%; }

  .picker {
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%);
  }
  .picker::-webkit-scrollbar { display: none; }

  .word {
    height: var(--item);
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    font-family: var(--font-display);
    font-size: 40px;
    line-height: 1;
    color: var(--muted);
    transition: color .18s ease, font-size .18s ease, transform .18s ease;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .word.on {
    color: var(--fg);
    font-size: 58px;
    font-style: italic;
  }

  /* centre band */
  .band {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: var(--item);
    transform: translateY(-50%);
    border-block: 1px solid var(--line);
    pointer-events: none;
  }
  .band::before, .band::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 6px; height: 6px;
    margin-top: -3px;
    border-radius: 50%;
    background: var(--accent);
  }
  .band::before { left: 0; }
  .band::after { right: 0; }

  .hud {
    position: absolute;
    left: 0; right: 0;
    bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
  }
  .hud b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
  .hud .mode { min-width: 0; }

  .head {
    position: absolute;
    left: 0; right: 0;
    top: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    pointer-events: none;
  }

  .test {
    pointer-events: auto;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
  }
  .test:active { border-color: var(--accent); color: var(--accent); }
  .test:focus-visible, .word:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .word { transition: none; }
  }
</style>

</head>
<body>
<div class="stage">
  <div class="head">Scorri</div>
  <div class="picker" id="picker" tabindex="0" aria-label="Elenco di parole"></div>
  <div class="band" aria-hidden="true"></div>
  <div class="hud">
    <span>Tick <b id="count">0</b></span>
    <span class="mode" id="mode">…</span>
    <button class="test" id="test" type="button">Prova</button>
  </div>
</div>

<script>
(function () {
  var WORDS = ["Alba","Brezza","Cenere","Dune","Eco","Falesia","Geyser","Nebbia","Ombra","Pioggia","Quarzo","Rugiada","Salina","Tramonto","Umbra","Vento","Zenit","Aurora","Brina","Cometa","Delta","Eclissi","Fiordo","Grotta","Isola","Lava","Marea","Nuvola","Onda","Prateria"];

  var picker = document.getElementById("picker");
  var countEl = document.getElementById("count");
  var modeEl = document.getElementById("mode");
  var testBtn = document.getElementById("test");

  // spacers so first/last word can reach the centre
  var padTop = document.createElement("div");
  var padBottom = document.createElement("div");
  picker.appendChild(padTop);
  var els = WORDS.map(function (w, i) {
    var d = document.createElement("div");
    d.className = "word";
    d.textContent = w;
    d.setAttribute("role", "option");
    d.addEventListener("click", function () { goTo(i); });
    picker.appendChild(d);
    return d;
  });
  picker.appendChild(padBottom);

  var ITEM = els[0].offsetHeight || 76;
  function layout() {
    ITEM = els[0].offsetHeight || 76;
    var pad = Math.max(0, (picker.clientHeight - ITEM) / 2);
    padTop.style.height = pad + "px";
    padBottom.style.height = pad + "px";
  }

  /* ---------- haptic ---------- */
  var canVibrate = typeof navigator.vibrate === "function";
  var label = document.createElement("label");
  label.setAttribute("aria-hidden", "true");
  label.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden";
  var sw = document.createElement("input");
  sw.type = "checkbox";
  sw.setAttribute("switch", "");
  sw.tabIndex = -1;
  label.appendChild(sw);
  document.body.appendChild(label);

  var switchOK = false;
  try { switchOK = CSS.supports("-webkit-appearance", "none") && "switch" in document.createElement("input"); } catch (e) {}
  // "switch" is a reflected attribute only where supported (Safari 17.4+)
  if (!switchOK) { try { switchOK = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && "ontouchend" in document; } catch (e) {} }

  var ticks = 0;
  function haptic() {
    ticks++;
    countEl.textContent = ticks;
    if (canVibrate) {
      try { if (navigator.vibrate(12)) return; } catch (e) {}
    }
    try { label.click(); } catch (e) {}
  }
  modeEl.textContent = canVibrate ? "Vibrate API" : (switchOK ? "Switch iOS" : "Nessun haptic");
  testBtn.addEventListener("click", haptic);

  /* ---------- selection ---------- */
  var current = -1;
  function indexFromScroll() {
    var i = Math.round(picker.scrollTop / ITEM);
    return Math.min(WORDS.length - 1, Math.max(0, i));
  }
  function select(i, silent) {
    if (i === current) return;
    if (current >= 0) els[current].classList.remove("on");
    els[i].classList.add("on");
    els[i].setAttribute("aria-selected", "true");
    if (current >= 0) els[current].removeAttribute("aria-selected");
    current = i;
    if (!silent) haptic();
  }
  function goTo(i) {
    picker.scrollTo({ top: i * ITEM, behavior: "smooth" });
  }

  var ticking = false;
  picker.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      select(indexFromScroll(), false);
    });
  }, { passive: true });

  window.addEventListener("resize", function () {
    var keep = current < 0 ? 0 : current;
    layout();
    picker.scrollTop = keep * ITEM;
  });

  layout();
  var start = Math.floor(WORDS.length / 3);
  picker.scrollTop = start * ITEM;
  select(start, true);
})();
</script>
</body>

</html>
